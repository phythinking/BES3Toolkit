// information for input root files
// S is abbreviation for signal, B for background and SpB for signal plus background
S          = /path/to/your/pi0ee_Sig_MC.root
B          = /path/to/your/pi0ee_INC_MC.root
SpB        = 
// name for tree
tree       = fit4c
//tree     = fit5c
// name of chisquare in root file
chisquare  = chi2
// Scale ratio of signal
ScaleRatio = 0.001
//itopo number of signal in inclusive MC root file with topology information, for example topo.root 
//Sitopo   = "itopo == 0 && itopo == 1"
itopoCut   = 
// information for cuts
basicCut   = mpi0 > 0.121 && mpi0< 0.148 && mepem < 0.84 && metap > 0.8 && metap < 1.0
// Step for chi2
chi2Step   = 10;
// information for output
outputDir  = . 
outputExt  = .png
// chi2 of cut arrow (Int_t)
chi2Arrow  = 30

